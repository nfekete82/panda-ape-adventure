name: panda-ape-adventure
services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    init: true
    restart: unless-stopped
    environment:
      PORT: 3001
      SAVE_DIR: /app/data
    volumes:
      - saves:/app/data
    expose:
      - '3001'
    mem_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 128m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
volumes:
  saves:
