name: Quality and containers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker compose config --quiet
      - run: docker compose -f compose.dev.yaml config --quiet
      - run: docker compose up -d --build --wait
      - run: npm run test:docker
      - run: npm run test:browser
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: 1
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: shrine-and-bamboo-captures
          path: |
            test-results/bamboo-crossing-*.png
            test-results/shrine-*.png
          if-no-files-found: error
      - run: docker compose down
        if: always()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-traces
          path: test-results/
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build server on both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build web on both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: false
