name: panda-ape-adventure-dev
services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    working_dir: /app
    init: true
    command: npm run dev
    ports:
      - '8080:8080'
    volumes:
      - .:/app
      - dev_modules:/app/node_modules
    environment:
      PORT: 3001
      SAVE_DIR: /tmp/panda-saves
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      start_period: 90s
      timeout: 3s
      retries: 5
volumes:
  dev_modules:
